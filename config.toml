# Smart speaker configuration. Paths are relative to this file.
# Every process (llm, asr, brain, voice) reads this same file, so each can be
# started on its own (`speaker brain`, `speaker voice`, ...) or all together
# (`speaker up`).

[character]
# Who the speaker is. Sent to the LLM as the system prompt, before the
# built-in rules about speaking style and tools.
prompt = """
Ты — домашняя колонка с характером: грубоватая, ленивая, саркастичная, но
всё-таки делаешь, что просят, и отвечаешь по делу. Можешь подколоть и
ругнуться, но без злобы. Своё имя и прозвище вслух не произноси.
"""
# What the speaker says when it hears only the wake phrase.
ack = { ru = "Чё такое?", en = "What do you want?" }

[wake]
# Spoken phrases that wake the speaker. Matching tolerates ASR spelling
# slips ("долбоеб", "пей долбаёб"); `threshold` is the minimum similarity 0..1.
phrases = ["Эй гптшка", "Эй колонка", "гптшка", "колонка"]
threshold = 0.78
# Recognition bias toward the phrases above. Higher catches more mumbled
# wakes but starts hearing the phrase in other speech (5 already does).
boost = 2.0
# Words that stop speech, a ringing timer or the current answer without the
# wake phrase, as long as the utterance is only that word.
stop_words = ["стоп", "хватит", "замолчи", "заткнись", "ебало закрой", "тихо", "отмена", "stop", "enough", "cancel", "shut up"]

[gate]
# Silero VAD skips silence, then Vosk small Russian listens for the wake
# phrase. The large Nemotron streams activate only after this gate (or while
# an answer/ring is active) and still verify the recognized text.
enabled = true
vad_model = "models/silero/vad.jit"
model = "models/vosk-model-small-ru-0.22"
vad_threshold = 0.5
# 100 ms chunks below this RMS (after mic_gain) skip VAD entirely. This room
# measured ≤0.0006 when quiet and 0.005-0.04 for speech chunks. 0 = always run VAD.
energy_floor = 0.0015
preroll_seconds = 2.0
# What the small Vosk model hears for each wake phrase; any of these opens the
# gate and Nemotron then checks the real phrase. Must use words Vosk knows (it
# lacks "гптшка" and hears it as "наташка"); update this with [wake] phrases.
grammar = ["эй колонка", "и колонка", "колонка", "эй наташка", "и наташка", "наташка", "[unk]"]

[audio]
# Substring of the PortAudio device name ("default" for the system default).
# speaker_in/speaker_out are the shared ALSA devices from alsa/speaker.conf;
# point that file at another card to change hardware.
input_device = "speaker_in"
output_device = "speaker_out"
# Output rate, and the mic capture rate. Mic audio is resampled to the 16 kHz
# speech recognition uses; a mic that sounds right at 16 kHz can set
# input_rate = 16000 (with the same rate in alsa/speaker.conf) to skip that.
sample_rate = 48000
input_rate = 48000
# Output channels the voice goes to. [0, 1] = both; [1] = right only.
output_channels = [0, 1]
# Mic gain applied before ASR (the headset mic is quiet).
mic_gain = 4.0
# Initial volume 0..10, like Yandex Station. Changed by voice later.
volume = 6
# Subtract what the speaker plays (answers, music) from the mic with LocalVQE,
# a small neural echo canceller, so the wake word and commands are heard over
# it. Needs the speaker and mic on one sound card (one clock).
echo_cancellation = true
echo_model = "models/localvqe-pi-aec-v1-49k-f32.gguf"

[music]
# Audio files to play (subfolders too). Optional sidecars per file: NAME.json
# {"title", "artist"} and NAME.txt with the lyrics (used to tell sung words
# from your voice). Without a .json, the file's own tags are used.
library = "music"
# Where music comes from, in search order. "local" = the library, "radio" =
# the stations below. Streaming services plug in as more providers (README).
providers = ["local", "radio"]
# Music volume while you talk or the speaker answers (fraction of normal).
duck_volume = 0.2
# You are talking over the music when the mic is this many times louder than
# the music alone would make it (2.0 = 6 dB).
talk_factor = 2.0
radio = { "Groove Salad" = "https://ice1.somafm.com/groovesalad-128-mp3", "Secret Agent" = "https://ice1.somafm.com/secretagent-128-mp3" }

[asr]
url = "ws://127.0.0.1:8090/v1/audio/transcriptions/realtime"
model = "models/nemotron-3.5-asr-streaming-0.6b.q8_0.gguf"
port = 8090
# Trailing silence that ends an utterance. Shorter answers sooner but cuts
# people off at pauses.
endpoint_ms = 500
# "vulkan" runs Nemotron on the Radeon iGPU: 5x faster than real time with
# ~1/20 of the CPU time (CPU needs ~2 CPU-seconds per audio second at any
# thread count). "cpu" also works; threads = CPU compute threads.
device = "vulkan"
threads = 4
# Language of the always-on stream that listens for the wake phrase and
# Russian commands. "auto" garbles a Russian wake phrase into Latin letters.
language = "ru-RU"
# Run a second, language-detecting stream so English commands work after the
# wake phrase (say the wake phrase, wait for the answer, then speak English).
detect_english = true

[tts]
# Silero voices. Russian speakers: aidar, baya, kseniya, xenia, eugene.
ru_model = "models/silero/v5_6_ru.pt"
ru_speaker = "aidar"
en_model = "models/silero/v3_en.pt"
en_speaker = "en_0"
sample_rate = 24000
threads = 4

[llm]
url = "http://127.0.0.1:8091/v1"
model = "models/LFM3-1.7B-QAD-Q4_0.gguf"
port = 8091
gpu_layers = 99
context = 16384
# Hidden reasoning before each answer. More is smarter but slower: the 780M
# generates ~65 tokens/s, so 64 tokens costs about one second. 128 gave no
# better answers in testing, only slower ones.
reasoning_budget = 64
# Reasoning after a tool returned (0 = none: just phrase the result).
tool_reasoning_budget = 0
# Upper bound, not a target: normal answers still stop at their natural end.
max_tokens = 4096
temperature = 0.1

[remote_llm]
# Explicit requests leave the machine only when this is enabled and the key is
# present. Any OpenAI-compatible /chat/completions endpoint works.
enabled = false
url = "https://api.openai.com/v1"
model = "gpt-4.1"
api_key_env = "REMOTE_LLM_API_KEY"
max_tokens = 4096
temperature = 0.3
timeout = 180
triggers = ["спроси большую модель", "ask the big model", "use the big model"]
# When LFM3 decides on its own to ask the big model, ask the user first
# ("Спросить большую модель?"). Explicit triggers above never ask.
confirm = true

[web_search]
# Parallel web search. LFM3 writes the queries in English and answers in the
# user's language. With $PARALLEL_API_KEY set, the API runs in `mode`
# ("turbo" ~0.2 s, English only; "fast" ~0.7 s); without a key, the free
# hosted endpoint is used (fast mode, lower rate limits).
enabled = true
api_key_env = "PARALLEL_API_KEY"
mode = "turbo"
results = 5
# Characters kept per result, to keep the prompt short.
excerpt_chars = 600
# Paid searches can't be capped on Parallel's side; this caps them here.
max_per_day = 200
timeout = 15
# When the big model is configured, ask whether it should answer from the
# search results ("Пусть ответит большая модель?") instead of LFM3.
offer_big_model = true

[harness]
# A real argv command, not a shell string. Every %p is replaced with the user
# prompt, e.g. 'pi -p %p'. Authentication and tools belong to that harness.
enabled = false
command = "pi -p %p"
cwd = "."
timeout = 300
triggers = ["запусти агента", "используй агента", "use the harness", "run the harness"]

[memory]
# EmbeddingGemma 2 (Q8_0 GGUF from ggml-org/embeddinggemma-2-GGUF) served by
# `speaker embed`. On the iGPU an embedding takes ~18 ms (131 ms on 4 CPU
# threads); it runs before LFM3 generates, so they don't compete.
model = "models/embeddinggemma-2-Q8_0.gguf"
url = "http://127.0.0.1:8092/v1"
port = 8092
gpu_layers = 99
threads = 4
state_file = "state/memory.sqlite3"
search_results = 5
# Before each LLM answer, memories at least this similar to the request are
# added to its prompt. Related facts scored 0.77+, unrelated ≤0.67 in testing.
# 0 disables automatic recall; the search_memory tool remains.
recall_threshold = 0.72
recall_results = 3

[brain]
host = "127.0.0.1"
port = 8770
# Answer timers, volume, stop and time instantly without the LLM.
fast_commands = true
# Weather location used when none is named (Open-Meteo, no API key).
home_city = "Москва"
state_file = "state/brain.json"

[voice]
brain_url = "ws://127.0.0.1:8770/ws"
# If the speaker explicitly asks a question, listen this long for its answer.
# Ordinary answers return to idle and require the wake phrase again.
follow_up_seconds = 6
# After the bare wake phrase, wait this long for the command.
listen_seconds = 7
