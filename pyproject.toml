[project]
name = "smart-speaker"
version = "0.1.0"
description = "Homemade Yandex-Station-like speaker: local STT, LLM and TTS"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp>=3.12",
    "numpy>=2.2",
    "num2words>=0.5.14",
    "sounddevice>=0.5",
    "soxr>=0.5",
    "torch==2.8.0",
    "vosk>=0.3.45",
]

[project.scripts]
speaker = "speaker.cli:main"

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["speaker"]
