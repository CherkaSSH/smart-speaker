# Shared access to the speaker's sound card, loaded through ALSA_CONFIG_PATH
# by the dev shell (see flake.nix). dmix/dsnoop let other programs (a music
# player, test scripts) play and record at the same time as the speaker.
#
# CARD is the ALSA card id from /proc/asound/cards ("X" is the Razer
# Kraken V3 X headset). Change it when you move to the standalone mic and
# speakers, e.g. CARD=Device. The dev shell copies this file into the Nix
# store: re-enter `nix develop` after editing it.

pcm.speaker_out {
    type plug
    slave.pcm {
        type dmix
        ipc_key 5978293
        ipc_perm 0660
        slave {
            pcm "hw:CARD=X,DEV=0"
            rate 48000
            channels 2
            format S16_LE
            # 40 ms periods: idle playback wakes the CPU 25 times a second
            # instead of 100; stopping speech for barge-in takes at most 40 ms.
            period_size 1920
            buffer_size 5760
        }
    }
}

pcm.speaker_in {
    type plug
    slave.pcm {
        type dsnoop
        ipc_key 5978294
        ipc_perm 0660
        slave {
            pcm "hw:CARD=X,DEV=0"
            # The Kraken's own 16 kHz mode sounds different and recognition
            # fails on it; 48 kHz resampled by the voice service works.
            rate 48000
            channels 2
            format S16_LE
            # 100 ms periods match the 100 ms chunks the voice service consumes.
            period_size 4800
            buffer_size 19200
        }
    }
}
