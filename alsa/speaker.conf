# Shared access to the speaker's sound card, loaded through ALSA_CONFIG_PATH
# by the dev shell (see flake.nix). dmix/dsnoop let other programs (a music
# player, test scripts) play and record at the same time as the speaker.
#
# CARD is the ALSA card id from /proc/asound/cards ("X" is the Razer
# Kraken V3 X headset). Change it when you move to the standalone mic and
# speakers, e.g. CARD=Device.

pcm.speaker_out {
    type plug
    slave.pcm {
        type dmix
        ipc_key 5978293
        ipc_perm 0660
        slave {
            pcm "hw:CARD=X,DEV=0"
            rate 48000
            channels 2
            format S16_LE
            period_size 480
            buffer_size 2880
        }
    }
}

pcm.speaker_in {
    type plug
    slave.pcm {
        type dsnoop
        ipc_key 5978294
        ipc_perm 0660
        slave {
            pcm "hw:CARD=X,DEV=0"
            rate 48000
            channels 2
            format S16_LE
            period_size 480
            buffer_size 2880
        }
    }
}
